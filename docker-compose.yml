services:

  api:
    build: .
    image: denissedoved/pas_manager:latest
    restart: unless-stopped
    env_file:
      - .env

    volumes:
      - ./data:/app/data

    ports:
      - "8000:8000"

    networks:
      - default
      - postgres_net
      # tunel:
      #   image: cloudflare/cloudflared:latest
      #   restart: unless-stopped
      #   command: tunnel --no-autoupdate run --token ${APP__TUNNEL_TOKEN}
      #   env_file:
      #     - .env

networks:
  postgres_net:
    external: true
    name: postgres_net
