services:

  api:
    build: .
    image: denissedoved/pas_manager:latest
    env_file:
      - .env

    volumes:
      - ./data:/app/data

    ports:
      - "5173:8080"

  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${APP__TUNNEL_TOKEN}
    env_file:
      - .env