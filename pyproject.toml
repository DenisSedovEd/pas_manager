[project]
name = "pas-manage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.30.0",
    "black>=25.11.0",
    "cryptography>=46.0.3",
    "psycopg2-binary>=2.9.11",
