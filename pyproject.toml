    "pydantic-settings>=2.12.0",
    "python-telegram-bot>=22.5",
    "ruff>=0.14.5",
    "sqlalchemy>=2.0.44",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
